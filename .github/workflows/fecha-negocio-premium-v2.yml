name: Fecha Negocio Premium V2
on:
  pull_request:
    paths:
      - 'fecha-negocio/**'
      - 'assets/premium/**'
      - 'ops/deploy-fecha-premium-v2.sh'
      - 'tests/fecha-negocio-deploy-preflight.sh'
      - 'tests/fecha-negocio-premium*.cjs'
      - '.github/workflows/fecha-negocio-premium-v2.yml'
  push:
    branches: [main, 'feature/fecha-negocio-assets-premium-20261111']
    paths:
      - 'fecha-negocio/**'
      - 'assets/premium/**'
      - 'ops/deploy-fecha-premium-v2.sh'
      - 'tests/fecha-negocio-deploy-preflight.sh'
      - 'tests/fecha-negocio-premium*.cjs'
      - '.github/workflows/fecha-negocio-premium-v2.yml'
permissions:
  contents: read
jobs:
  premium-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: node --check fecha-negocio/preview.js
      - name: Validar sintaxe do deploy restrito
        run: bash -n ops/deploy-fecha-premium-v2.sh
      - name: Testar preflight sem escrita e rejeição de conflitos
        run: bash tests/fecha-negocio-deploy-preflight.sh
      - name: Validar artes, integridade, CTA e modelos
        run: node --test tests/fecha-negocio-premium-v2.test.cjs
      - name: Validar layout no navegador (390px e 1366px)
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node tests/fecha-negocio-premium-browser.cjs
