server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    if ($host = www.proximaera.com.br) { return 301 https://proximaera.com.br$request_uri; }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /assets/ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; }
    location = /api/contact {
        proxy_pass http://proximaera-admin-app-1:3000/api/public-contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }
    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}